<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filtros por Convolución</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f4f4;
      color: #333;
    }

    header {
      background: #0057b8;
      color: #fff;
      text-align: center;
      padding: 2rem 1rem;
    }

    main {
      max-width: 900px;
      margin: 2rem auto;
      padding: 1.5rem;
      background: #fff;
      box-shadow: 0 0 18px rgba(0, 0, 0, 0.08);
      border-radius: 10px;
    }

    .button {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.9rem 1.6rem;
      background: #0078d4;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      transition: background 0.2s ease;
    }

    .button:hover {
      background: #005ea5;
    }

    footer {
      text-align: center;
      color: #666;
      padding: 1rem 0;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Filtros por Convolución</h1>
    <p>Bienvenido. Haz clic en el botón para abrir la página de filtros.</p>
  </header>
  <main>
    <h2>Iniciar</h2>
    <p>Este proyecto utiliza una página secundaria llamada <strong>FILTROS.html</strong> para mostrar efectos de convolución en imágenes.</p>
    <a class="button" href="FILTROS.html">Abrir FILTROS.html</a>
  </main>
  <footer>
    <p>Abre el archivo <strong>FILTROS.html</strong> para continuar con la demo.</p>
  </footer>
</body>
</html>
